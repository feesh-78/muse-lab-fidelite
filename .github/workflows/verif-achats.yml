# Vérification temporaire : état de la table des achats (sans prénoms)
name: Vérification achats

on:
  push:
    branches: [claude/kind-knuth-gqn1lf]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verif:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Achats
        run: |
          URL=https://nxqttyosjjirqtcvfkbk.supabase.co/rest/v1
          KEY=$(grep -oE "eyJ[^']+" supabase-config.js)
          curl -s -H "apikey: $KEY" -H "Authorization: Bearer $KEY" \
            "$URL/menage_achats?select=id,article,quantite,note,studio,fait,prix,created_at&order=created_at.asc" \
            | python3 -c "
          import sys, json
          rows = json.load(sys.stdin)
          print('nombre de lignes :', len(rows))
          for r in rows:
              print(r['id'], '|', r['created_at'][:16], '|', r['article'], '|', 'studio', r['studio'], '|', 'fait' if r['fait'] else 'à acheter', '|', 'prix', r['prix'], '|', 'qte', r['quantite'], '|', 'note', r['note'])
          "
          echo "== colonne prix"
          curl -s -o /dev/null -w "select prix : HTTP %{http_code}\n" -H "apikey: $KEY" -H "Authorization: Bearer $KEY" "$URL/menage_achats?select=prix&limit=1"
