# Publie le site sur GitHub Pages à chaque mise à jour de main
name: Déploiement GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Préparer les fichiers du site
        run: |
          mkdir _site
          cp *.html *.css *.js _site/
          # Le site ménage s'ouvre directement à la racine du domaine,
          # l'appli fidélité reste accessible sur /fidelite.html
          cp index.html _site/fidelite.html
          cp menage.html _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Vérifier que le site en ligne sert la nouvelle version
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -fsS "https://menage.themuselab.fr/menage.js?v=${GITHUB_SHA}" | grep -q "saveSuivi"; then
              echo "Site à jour : https://menage.themuselab.fr"; exit 0
            fi
            sleep 20
          done
          echo "::warning::Le site ne sert pas encore la nouvelle version (cache GitHub Pages ?)"
