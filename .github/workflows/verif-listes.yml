# Vérification temporaire : listes de tâches et de produits (aucune donnée personnelle)
name: Vérification listes
on:
  push:
    branches: [claude/kind-knuth-gqn1lf]
permissions:
  contents: read
jobs:
  verif:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Listes
        run: |
          URL=https://nxqttyosjjirqtcvfkbk.supabase.co/rest/v1
          KEY=$(grep -oE "eyJ[^']+" supabase-config.js)
          curl -s -H "apikey: $KEY" -H "Authorization: Bearer $KEY" "$URL/menage_items?select=id,list,label,position&order=list,position" \
            | python3 -c "import sys,json; [print('ITEM', r['id'], '|', r['list'], '|', r['position'], '|', r['label']) for r in json.load(sys.stdin)]"
          curl -s -H "apikey: $KEY" -H "Authorization: Bearer $KEY" "$URL/menage_achats?select=id,article,studio,fait,note,quantite&fait=eq.false" \
            | python3 -c "import sys,json; [print('ACHAT', r) for r in json.load(sys.stdin)]"
