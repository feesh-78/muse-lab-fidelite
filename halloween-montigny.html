<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Dark Feminine</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap"><style>
:root{--bg:#0b0909;--panel:#171213;--line:#352b2c;--fg:#f6f1ef;--muted:#b4a8a8;--wine:#5A1017;--rose:#dc8f97;--blush:#efcdd0;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--fg);font-family:'Poppins','Helvetica Neue',Arial,sans-serif;-webkit-font-smoothing:antialiased}
.app{max-width:520px;margin:0 auto;padding-bottom:40px}
.hero{position:relative;height:62vh;min-height:380px;max-height:560px;background-size:cover}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,9,9,.7) 0%,rgba(11,9,9,.05) 25%,rgba(11,9,9,.1) 50%,rgba(11,9,9,.85) 80%,var(--bg) 100%)}
.bar{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:18px 20px;z-index:2}
.mark{font-weight:700;letter-spacing:-.04em;font-size:18px}
.pill{font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;border:1px solid var(--fg);border-radius:99px;padding:6px 12px;background:rgba(11,9,9,.35)}
.head{position:absolute;left:0;right:0;bottom:6px;padding:0 76px 0 20px;z-index:2;display:flex;flex-direction:column;gap:8px}
.hi{font-size:13px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--rose)}
h1{margin:0;font-size:clamp(46px,14vw,68px);font-weight:700;letter-spacing:-.06em;line-height:.88}
.words{font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--rose)}
.ico{width:46px;height:46px;position:absolute;right:20px;bottom:14px;z-index:2}
.body{padding:18px 20px 0;display:flex;flex-direction:column;gap:18px}
.portrait{margin:0;font-size:16px;line-height:1.6;color:#e9e1df}
.quote{margin:0;font-size:22px;font-weight:700;letter-spacing:-.035em;line-height:1.2}
.quote::before{content:"« ";color:var(--rose)}.quote::after{content:" »";color:var(--rose)}
.traits{border-top:1px solid var(--fg)}
.tr{padding:12px 0;border-bottom:1px solid var(--line)}
.lab{display:block;font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--rose);margin-bottom:4px}
.tr p{margin:0;font-size:15px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.box{border-radius:16px;padding:16px;background:var(--panel)}.box.w{background:var(--wine)}.box.w .lab{color:var(--blush)}
.box p{margin:0;font-size:14px;line-height:1.45}.box b{display:block;font-size:19px;letter-spacing:-.03em;margin-bottom:2px}
.secret{margin-top:6px;border-radius:20px;background:var(--wine);padding:22px 20px;display:flex;flex-direction:column;gap:12px;position:relative;overflow:hidden}
.secret h2{margin:0;font-size:32px;font-weight:700;letter-spacing:-.055em;line-height:.95}
.secret .lab{color:var(--blush)}
.reveal{appearance:none;font:inherit;font-weight:700;font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--wine);background:var(--fg);border:0;border-radius:99px;padding:16px 22px;cursor:pointer;align-self:flex-start}
.target{display:none;flex-direction:column;gap:4px}
.target.on{display:flex}
.target .name{font-size:48px;font-weight:700;letter-spacing:-.06em;line-height:1}
.rules{margin:0;padding-left:18px;font-size:14px;line-height:1.55;color:#f3dfe0}
.foot{padding:26px 20px 0;display:flex;justify-content:space-between;font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#7d7071}
 .c{min-height:100vh;display:flex;flex-direction:column;justify-content:center;gap:16px;padding:24px}</style></head><body><div class="app c"><span class="mark">themuselab.</span><h1>dark<br>feminine.</h1><p class="portrait">Scanne le QR code à ton prénom pour découvrir ton alter ego et ta cible.</p></div></body></html>
