/* Layout: one full-height screen at a time — intro, infos, 8 questions, départage si besoin, fin */
:root{
  --bg:#0b0909; --panel:#171213; --line:#352b2c; --fg:#f6f1ef; --muted:#b4a8a8;
  --wine:#5A1017; --rose:#dc8f97; --blush:#efcdd0;
  --sans:'Poppins','Helvetica Neue',Arial,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}

.app{max-width:520px;min-height:100%;margin:0 auto;display:flex;flex-direction:column}
.bar{display:flex;justify-content:space-between;align-items:center;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));padding-block:20px 8px;position:relative;z-index:2}
.mark{font-weight:700;letter-spacing:-.04em;font-size:19px}
.pill{font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;border:1px solid var(--fg);border-radius:99px;padding:6px 12px}
.screen{flex:1;display:flex;flex-direction:column;gap:22px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));padding-block:12px 32px;animation:in .45s ease both}

h1{margin:0;font-size:clamp(56px,17vw,84px);font-weight:700;letter-spacing:-.06em;line-height:.88}
h2{margin:0;font-size:clamp(28px,8vw,36px);font-weight:700;letter-spacing:-.05em;line-height:1.05;text-wrap:balance}
.lead{margin:0;color:#e9e1df;max-width:34ch}
.btn{appearance:none;font:inherit;font-weight:700;font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--fg);background:var(--wine);border:0;border-radius:99px;padding:17px 26px;cursor:pointer;align-self:flex-start}
.btn:disabled{opacity:.4;cursor:default}
.btn:focus-visible,.opt:focus-visible,input:focus-visible{outline:2px solid var(--rose);outline-offset:3px}
.ghost{appearance:none;background:none;border:0;color:var(--muted);font:inherit;font-size:13px;cursor:pointer;padding:6px 0;align-self:flex-start}
.prog{display:flex;gap:5px}
.prog i{flex:1;height:3px;border-radius:3px;background:var(--line)}
.prog i.on{background:var(--rose)}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{appearance:none;text-align:left;font:inherit;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px 18px;cursor:pointer;display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;align-items:baseline;transition:border-color .2s,background .2s}
.opt b{color:var(--rose);font-weight:700}
.opt:hover{border-color:var(--rose)}
.opt.sel{background:var(--wine);border-color:var(--wine)}
.opt.sel b{color:var(--blush)}
.field{display:flex;flex-direction:column;gap:7px}
.field label{font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--rose)}
.field input{font:inherit;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.err{color:var(--blush);font-size:13px;min-height:1em;margin:0}
.seal{width:64px;height:64px;border-radius:50%;background:var(--wine);display:grid;place-items:center;font-weight:700;font-size:22px;letter-spacing:-.04em}
.note{font-size:12px;color:var(--muted)}
.foot{font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#7d7071;display:flex;justify-content:space-between;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));padding-block:0 20px}
@media (prefers-reduced-motion:reduce){.screen{animation:none}.opt{transition:none}}
</style>
<style>*{box-sizing:border-box}body{margin:0}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
</head>
<body>

<div class="app">
  <div class="bar"><span class="mark">themuselab.</span><span class="pill">Halloween Night</span></div>
  <main id="view" class="screen" aria-live="polite"></main>
  <div class="foot"><span>dark feminine</span><span>31 oct. · 1er nov.</span></div>
</div>

<script>
/* ===== Réglages ===== */
var EMAIL = "team@themuselab.fr"; /* adresse qui reçoit les réponses (via FormSubmit) */

var Q = [
 ["Quelle musique te fait vibrer ?", ["des sons envoûtants et hypnotiques","des sons sensuels et intenses","des morceaux dramatiques et majestueux","des hits qui donnent envie de danser tout de suite"]],
 ["Dans un groupe, tu es…", ["celle qui ressent les choses avant tout le monde","celle qui assume pleinement sa sensualité","celle qui prend naturellement les commandes","celle qui entraîne tout le monde dans ses idées"]],
 ["Quelle activité choisirais-tu pour Halloween ?", ["une expérience mystique pleine de surprises","un cours de danse sensuelle dans une ambiance glamour","un bal masqué avec une mise en scène spectaculaire","un challenge danse, des jeux et une fête collective"]],
 ["Quelle phrase te correspond le mieux ?", ["« Je préfère être mystérieuse que prévisible. »","« Je connais mon pouvoir et je l'assume. »","« Je ne suis pas venue pour passer inaperçue. »","« Je suis là pour vivre, rire et tout donner. »"]],
 ["Quel dress code te ressemble le plus ?", ["sorcière mystérieuse, dentelle noire et bijoux","vampire glamour, rouge profond","reine gothique, velours, couronne et masque","look dark et audacieux, plein de paillettes"]],
 ["Choisis ton pouvoir surnaturel.", ["lire dans les pensées","hypnotiser qui je veux","contrôler les autres avec mon charisme","avoir une énergie infinie"]],
 ["Ton Halloween idéal, c'est…", ["une ambiance mystique, des bougies et des surprises","une soirée glamour et sexy","un univers chic, théâtral et spectaculaire","une fête déjantée où l'on danse jusqu'au bout de la nuit"]],
 ["Quand tu arrives à une soirée, tu es plutôt…", ["celle qui observe tout et intrigue les autres","celle qui attire immédiatement les regards","celle qui entre comme la reine de la soirée","celle qui met tout le monde dans l'ambiance"]]
];
var TIE = ["Minuit sonne. Que fais-tu ?", ["je disparais sans un mot, et tout le monde se demande où je suis","je m'approche de quelqu'un et je le fais fondre d'un regard","je monte sur scène et je porte un toast à ma soirée","je lance la choré et tout le monde suit"]];
var L = ["A","B","C","D"];
var AE = {A:"The Dark Femme",B:"The Devil",C:"The Queen",D:"The It Girl"};

var st = {step:"intro", prenom:"", contact:"", soiree:"", answers:[], tie:null, i:0};
var view = document.getElementById("view");
function h(tag, attrs, kids){var e=document.createElement(tag);for(var k in (attrs||{})){if(k==="text")e.textContent=attrs[k];else if(k==="on")for(var ev in attrs.on)e.addEventListener(ev,attrs.on[ev]);else e.setAttribute(k,attrs[k]);}(kids||[]).forEach(function(c){if(c)e.appendChild(c);});return e;}
function show(nodes){view.textContent="";view.style.animation="none";void view.offsetWidth;view.style.animation="";nodes.forEach(function(n){view.appendChild(n);});window.scrollTo(0,0);}

function counts(){var c={A:0,B:0,C:0,D:0};st.answers.forEach(function(a){c[a]++;});return c;}
function leaders(){var c=counts(),m=Math.max(c.A,c.B,c.C,c.D);return L.filter(function(x){return c[x]===m;});}
function result(){var top=leaders();if(top.length===1)return {ae:top[0],tie:false};if(st.tie&&top.indexOf(st.tie)>-1)return {ae:st.tie,tie:true};return {ae:null,tie:true,between:top};}

function intro(){
  show([
    h("div",{class:"hero","aria-hidden":"true"}),
    h("div",{class:"eyebrow",text:"Halloween Night · ton alter ego"}),
    h("h1",{},[document.createTextNode("dark"),h("br"),document.createTextNode("feminine.")]),
    h("p",{class:"lead",text:"Ce week-end, une autre version de toi va sortir de l'ombre. Réponds à l'instinct, sans trop réfléchir : 8 questions pour révéler ton alter ego. Il t'attendra le jour J, scellé dans ton enveloppe."}),
    h("button",{class:"btn",type:"button",on:{click:infos}, text:"Commencer"})
  ]);
}

function infos(){
  var err=h("p",{class:"err",role:"alert"});
  var fP=h("input",{id:"prenom",autocomplete:"given-name",value:st.prenom});
  var fC=h("input",{id:"contact",autocomplete:"tel",inputmode:"text",value:st.contact,placeholder:"06… ou ton mail"});
  var opts=h("div",{class:"opts"});
  [["Boulogne","Samedi 31 octobre · Boulogne"],["Montigny","Dimanche 1er novembre · Montigny"]].forEach(function(s){
    var b=h("button",{class:"opt"+(st.soiree===s[0]?" sel":""),type:"button","aria-pressed":st.soiree===s[0]?"true":"false",on:{click:function(){st.soiree=s[0];[].forEach.call(opts.children,function(x){x.classList.remove("sel");x.setAttribute("aria-pressed","false");});b.classList.add("sel");b.setAttribute("aria-pressed","true");}}},[h("b",{text:"✦"}),h("span",{text:s[1]})]);
    opts.appendChild(b);
  });
  show([
    h("div",{class:"eyebrow",text:"Avant de commencer"}),
    h("h2",{text:"Qui es-tu, mystérieuse invitée ?"}),
    h("div",{class:"field"},[h("label",{for:"prenom",text:"Ton prénom"}),fP]),
    h("div",{class:"field"},[h("label",{for:"contact",text:"Ton téléphone ou ton mail"}),fC]),
    h("div",{class:"field"},[h("label",{text:"Ta soirée"}),opts]),
    err,
    h("button",{class:"btn",type:"button",text:"C'est parti",on:{click:function(){
      st.prenom=fP.value.trim();st.contact=fC.value.trim();
      if(!st.prenom){err.textContent="Écris ton prénom pour qu'on prépare ton enveloppe.";return;}
      if(!st.contact){err.textContent="Laisse un téléphone ou un mail, au cas où on doive te joindre.";return;}
      if(!st.soiree){err.textContent="Choisis ta soirée : Boulogne ou Montigny.";return;}
      st.i=0;question();
    }}})
  ]);
}

function progress(n,total){var p=h("div",{class:"prog","aria-label":"Question "+(n+1)+" sur "+total});for(var k=0;k<total;k++)p.appendChild(h("i",{class:k<=n?"on":""}));return p;}

function question(){
  var i=st.i,q=Q[i];
  var opts=h("div",{class:"opts"});
  q[1].forEach(function(t,k){
    opts.appendChild(h("button",{class:"opt"+(st.answers[i]===L[k]?" sel":""),type:"button",on:{click:function(){
      st.answers[i]=L[k];
      this.classList.add("sel");
      setTimeout(function(){ if(i<Q.length-1){st.i++;question();} else afterQuestions(); },220);
    }}},[h("b",{text:L[k]}),h("span",{text:t})]));
  });
  show([
    progress(i,Q.length),
    h("div",{class:"eyebrow",text:"Question "+(i+1)+" / "+Q.length}),
    h("h2",{text:q[0]}),
    opts,
    h("button",{class:"ghost",type:"button",text:"← Retour",on:{click:function(){ if(i===0)infos(); else {st.i--;question();} }}})
  ]);
}

function afterQuestions(){ if(leaders().length>1) tie(); else send(); }

function tie(){
  var opts=h("div",{class:"opts"});
  TIE[1].forEach(function(t,k){
    opts.appendChild(h("button",{class:"opt",type:"button",on:{click:function(){st.tie=L[k];this.classList.add("sel");setTimeout(send,220);}}},[h("b",{text:L[k]}),h("span",{text:t})]));
  });
  show([
    h("div",{class:"eyebrow",text:"Dernière question"}),
    h("h2",{text:TIE[0]}),
    opts
  ]);
}

function payload(){
  var r=result(),c=counts();
  var d={
    _subject:"Dark Feminine · "+st.prenom+" · "+st.soiree+" · "+(r.ae?AE[r.ae]:"égalité à trancher"),
    _template:"table", _captcha:"false",
    "Prénom":st.prenom, "Contact":st.contact, "Soirée":st.soiree,
    "Alter ego":r.ae?AE[r.ae]+" ("+r.ae+")":"Égalité entre "+r.between.map(function(x){return AE[x];}).join(" et ")+" : à toi de choisir",
    "Décompte":"A "+c.A+" · B "+c.B+" · C "+c.C+" · D "+c.D,
    "Départage":st.tie?st.tie+" ("+AE[st.tie]+")":"non utilisé"
  };
  Q.forEach(function(q,k){d["Q"+(k+1)+" · "+q[0]]=st.answers[k]+" · "+q[1][L.indexOf(st.answers[k])];});
  return d;
}

function sending(){show([h("div",{class:"seal",text:"…"}),h("h2",{text:"Ton alter ego se scelle…"})]);}

function send(){
  sending();
  var preview=!!window.claude; /* aperçu dans Claude : rien n'est envoyé */
  if(preview){setTimeout(function(){done(true);},700);return;}
  fetch("https://formsubmit.co/ajax/"+encodeURIComponent(EMAIL),{method:"POST",headers:{"Content-Type":"application/json","Accept":"application/json"},body:JSON.stringify(payload())})
    .then(function(r){if(!r.ok)throw new Error(r.status);return r.json();})
    .then(function(){done(false);})
    .catch(function(){fail();});
}

function fail(){
  show([
    h("div",{class:"eyebrow",text:"Oups"}),
    h("h2",{text:"Tes réponses ne sont pas parties."}),
    h("p",{class:"lead",text:"Vérifie ta connexion, puis réessaie. Tes réponses sont gardées."}),
    h("button",{class:"btn",type:"button",text:"Réessayer",on:{click:send}})
  ]);
}

function done(preview){
  var nodes=[
    h("div",{class:"seal",text:"DF"}),
    h("div",{class:"eyebrow",text:"C'est noté, "+st.prenom}),
    h("h2",{text:"Ton alter ego est scellé."}),
    h("p",{class:"lead",text:"Il t'attend le jour J, dans ton enveloppe. Ouverture des portes à 19h. Viens habillée pour lui."}),
    h("p",{class:"lead",text:"Laisse ton dark side sortir ce soir."})
  ];
  if(preview)nodes.push(h("p",{class:"note",text:"Aperçu : dans cette version, rien n'est envoyé."}));
  show(nodes);
}

intro();
</script>

</body>
</html>
